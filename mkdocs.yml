site_name: Wiki de Son Banyaland
site_description: Todo lo que hay en el servidor de Minecraft Son Banyaland, con los datos exactos.
site_url: https://pigpilgrim.github.io/Son_Banyaland_wiki/
repo_url: https://github.com/PigPilgrim/Son_Banyaland_wiki
repo_name: Son_Banyaland_wiki
edit_uri: edit/main/docs/
copyright: Son Banyaland · un servidor de "rol", de mí para tú, de mí para vosotros

theme:
  name: material
  language: es
  logo: img/icono.png
  favicon: img/icono.png
  font: false              # las fuentes del diseño (Grenze, Alegreya Sans, Pixelify Sans) las carga extra.css
  palette:
    # Oscuro "banyaland" (el principal) y claro "pergamino": colores en docs/stylesheets/extra.css
    - scheme: banyaland
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo pergamino (claro)
    - scheme: pergamino
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: docs
      check_paths: true

validation:
  links:
    anchors: warn             # un enlace a un apartado que no existe hace fallar la comprobación

exclude_docs: |
  _generado/

nav:
  - Inicio: index.md
  - Empezar:
      - Dinero: dinero.md
  - La aldea:
      - Cómo crece la aldea: aldea.md
      - Los aldeanos y sus tiendas: aldeanos.md
      - La Taberna: taberna.md
      - Proyectos de la Oficina: proyectos.md
      - Misiones del Pregonero: misiones.md
      - Casas, buzones y cartas: casas.md
      - Política: politica.md
      - Hacienda, Tesoro y empresas: hacienda.md
      - Justicia: justicia.md
      - La Iglesia: iglesia.md
      - Guerra y asedios: guerra.md
  - Mazmorras y objetos:
      - Mazmorras: mazmorras.md
      - Armas y armaduras: forja.md
      - Magia: magia.md
  - Minijuegos: minijuegos.md
  - Comandos y extras: plugins.md
  - Historia: historia.md
  - Pendientes: pendientes.md
